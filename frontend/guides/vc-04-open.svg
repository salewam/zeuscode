<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img" aria-label="Открыть Continue">
  <defs><style>
  .bg { fill: #0e1116; }
  .panel { fill: #1e1e1e; stroke: #3c3c3c; stroke-width: 1; }
  .bar { fill: #252526; }
  .side { fill: #333333; }
  .txt { fill: #cccccc; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  .w { fill: #ffffff; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  .muted { fill: #858585; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  .blue { fill: #0078d4; }
  .field { fill: #3c3c3c; }
  .field-on { fill: #2a2d2e; stroke: #e8a84a; stroke-width: 2.5; }
  .call { fill: #e8a84a; }
  .call-t { fill: #1a1206; font-family: -apple-system, system-ui, sans-serif; font-weight: 800; }
  .ok { fill: #3dd68c; }
  .btn-t { fill: #fff; font-family: -apple-system, system-ui, sans-serif; font-weight: 700; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .cap { fill: #e8a84a; font-family: -apple-system, system-ui, sans-serif; font-weight: 700; }
</style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e8a84a"/>
    </marker>
  </defs>
  <rect class="bg" width="480" height="310" rx="14"/>
  
  <rect class="bar" x="16" y="16" width="448" height="32" rx="8"/>
  <text class="muted" x="32" y="37" font-size="12">VS Code</text>
  <rect class="side" x="16" y="48" width="56" height="246"/>
  <!-- continue icon in activity -->
  <rect x="24" y="100" width="40" height="40" rx="8" fill="#1e1e1e" stroke="#e8a84a" stroke-width="2.5"/>
  <text class="w" x="44" y="126" text-anchor="middle" font-size="16" font-weight="800">C</text>
  <circle class="call" cx="78" cy="120" r="15"/><text class="call-t" x="78" y="125" text-anchor="middle" font-size="14">1</text>
  <rect class="panel" x="72" y="48" width="392" height="246"/>
  <text class="w" x="96" y="80" font-size="18" font-weight="800">Continue</text>
  <text class="muted" x="96" y="106" font-size="13">Чат помощника открылся справа / слева</text>
  <rect class="field" x="96" y="130" width="340" height="90" rx="8"/>
  <text class="muted" x="112" y="175" font-size="14">Ask Continue…</text>
  <text class="cap" x="268" y="260" text-anchor="middle" font-size="13">Или клавиши: Ctrl+L  (Mac: ⌘L)</text>

</svg>