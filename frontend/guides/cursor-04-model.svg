<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img" aria-label="Cursor: добавить модель">
  <defs><style>
  .bg { fill: #0e1116; }
  .panel { fill: #151a22; stroke: #2a3140; stroke-width: 1.5; }
  .side { fill: #12161e; stroke: #2a3140; stroke-width: 1; }
  .top { fill: #1a1f2a; }
  .muted { fill: #6b7385; font-family: -apple-system, system-ui, sans-serif; }
  .txt { fill: #e8eaed; font-family: -apple-system, system-ui, sans-serif; }
  .hint { fill: #8b93a7; font-family: -apple-system, system-ui, sans-serif; }
  .accent { fill: #2aabee; }
  .field { fill: #0e1116; stroke: #3a4458; stroke-width: 1.5; rx: 8; }
  .field-on { fill: #0e1116; stroke: #e8a84a; stroke-width: 2.5; rx: 8; }
  .btn { fill: #2aabee; }
  .btn-t { fill: #fff; font-family: -apple-system, system-ui, sans-serif; font-weight: 700; }
  .call { fill: #e8a84a; }
  .call-t { fill: #1a1206; font-family: -apple-system, system-ui, sans-serif; font-weight: 800; }
  .arrow { stroke: #e8a84a; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .arrow-h { fill: #e8a84a; }
  .chip { fill: #243044; }
  .sel { fill: #1e3a4f; stroke: #2aabee; stroke-width: 1.5; }
  .ok { fill: #3dd68c; }
</style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" class="arrow-h"/>
    </marker>
  </defs>
  <rect class="bg" width="480" height="310" rx="16"/>
  
  <rect class="panel" x="12" y="12" width="456" height="286" rx="10"/>
  <text class="txt" x="32" y="42" font-size="16" font-weight="800">Добавь модель</text>
  <text class="hint" x="32" y="64" font-size="12">В поиске моделей набери имя и Add</text>

  <rect class="field-on" x="32" y="90" width="300" height="44" rx="8"/>
  <text class="txt" x="48" y="117" font-size="14">zeuscode</text>
  <rect class="btn" x="344" y="94" width="100" height="36" rx="8"/>
  <text class="btn-t" x="394" y="117" text-anchor="middle" font-size="12">Add model</text>
  
    <circle class="call" cx="170" cy="78" r="14"/>
    <text class="call-t" x="170" y="83" text-anchor="middle" font-size="14">1</text>
    
  
    <circle class="call" cx="394" cy="78" r="14"/>
    <text class="call-t" x="394" y="83" text-anchor="middle" font-size="14">2</text>
    

  <rect class="sel" x="32" y="160" width="416" height="48" rx="8"/>
  <circle class="ok" cx="56" cy="184" r="8"/>
  <text class="txt" x="76" y="189" font-size="14" font-weight="700">zeuscode  ·  ZeusCode</text>
  
    <circle class="call" cx="420" cy="184" r="14"/>
    <text class="call-t" x="420" y="189" text-anchor="middle" font-size="14">3</text>
    

  <text class="call" x="240" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#e8a84a">1 вставь имя · 2 Add · 3 выбери в чате</text>
  <text class="hint" x="240" y="280" text-anchor="middle" font-size="12">В чате модель называется ZeusCode</text>

