<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img" aria-label="Roo gear">
  <defs><style>
  .bg { fill: #0e1116; }
  .panel { fill: #1e1e1e; stroke: #3c3c3c; stroke-width: 1; }
  .bar { fill: #252526; }
  .side { fill: #333333; }
  .txt { fill: #cccccc; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  .w { fill: #ffffff; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  .muted { fill: #858585; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  .blue { fill: #0078d4; }
  .field { fill: #3c3c3c; }
  .field-on { fill: #2a2d2e; stroke: #e8a84a; stroke-width: 2.5; }
  .call { fill: #e8a84a; }
  .call-t { fill: #1a1206; font-family: -apple-system, system-ui, sans-serif; font-weight: 800; }
  .btn-t { fill: #fff; font-family: -apple-system, system-ui, sans-serif; font-weight: 700; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .cap { fill: #e8a84a; font-family: -apple-system, system-ui, sans-serif; font-weight: 700; }
</style></defs>
  <rect class="bg" width="480" height="310" rx="14"/>
  
  <rect class="panel" x="16" y="16" width="448" height="278" rx="12"/>
  <text class="w" x="36" y="48" font-size="16" font-weight="800">Roo Code · настройки</text>
  <rect class="field-on" x="400" y="28" width="40" height="36" rx="8"/>
  <text class="w" x="420" y="52" text-anchor="middle" font-size="16">⚙</text>
  <circle class="call" cx="360" cy="46" r="15"/><text class="call-t" x="360" y="51" text-anchor="middle" font-size="14">1</text>
  <text class="txt" x="36" y="120" font-size="14">1. Открой Roo Code слева</text>
  <text class="txt" x="36" y="148" font-size="14">2. Нажми шестерёнку сверху</text>
  <text class="txt" x="36" y="176" font-size="14">3. Заполни провайдер, адрес, ключ, модель</text>
  <text class="cap" x="240" y="260" text-anchor="middle" font-size="13">Дальше — куда что вставить</text>

</svg>