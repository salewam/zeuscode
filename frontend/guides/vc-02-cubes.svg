<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img" aria-label="Кубики Extensions">
  <defs><style>
  .bg { fill: #0e1116; }
  .panel { fill: #1e1e1e; stroke: #3c3c3c; stroke-width: 1; }
