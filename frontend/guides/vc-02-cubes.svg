  <text class="muted" x="44" y="110" text-anchor="middle" font-size="10">файлы</text>
  <!-- search -->
  <circle cx="44" cy="140" r="9" fill="none" stroke="#858585" stroke-width="1.5"/>
  <!-- EXTENSIONS CUBES - large and clear -->
