  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .cap { fill: #e8a84a; font-family: -apple-system, system-ui, sans-serif; font-weight: 700; }
</style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e8a84a"/>
    </marker>
  </defs>
  <rect class="bg" width="480" height="310" rx="14"/>
  
  <!-- title bar -->
  <rect class="bar" x="16" y="16" width="448" height="32" rx="8"/>
