<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="318" viewBox="0 0 480 318" role="img" aria-label="Cursor: вставить ключ и адрес">
  <defs><style>
